[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-satellite-beam-game"
version = "0.1.0"
description = "Game-theoretic UAV task offloading to LEO satellite beams: physics-based models, two update rules (best response & replicator dynamics), counterfactual Nash equilibrium verification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "futation" }]
keywords = [
    "UAV", "LEO satellite", "task offloading", "evolutionary game",
    "congestion game", "Nash equilibrium", "replicator dynamics", "simulation",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "tqdm>=4.60",
]

[project.optional-dependencies]
viz3d = ["vtk>=9.0"]
dev = ["pytest>=7.0"]

# 研究代码以"克隆即用"为主：不安装任何顶层包，避免 config/utils 这类
# 通用包名污染 site-packages；此文件仅提供元数据与依赖解析。
[tool.setuptools]
py-modules = []
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
